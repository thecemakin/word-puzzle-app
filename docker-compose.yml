services:
  postgres:
    image: postgres:16-alpine
    container_name: word_puzzle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wordpuzzle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wordpuzzle_dev}
      POSTGRES_DB: ${POSTGRES_DB:-wordpuzzle}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wordpuzzle} -d ${POSTGRES_DB:-wordpuzzle}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
